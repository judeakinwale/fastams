name: Docker Image CI

on:
  push:
    branches: ["main", "lban"]
  pull_request:
    branches: ["main", "lban"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      #  TODO: uncomment the azure registry code for lban deployment
      # Deploy to azure container registry

      - name: Login to Azure Container Registry using Docker
        run: docker login lbanapps.azurecr.io --username ${{ secrets.OS_REG_USERNAME }} --password ${{ secrets.OS_REG_PASSWORD }}

      - name: Build the Docker image
        # run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
        run: docker build . --file Dockerfile --tag fastams:lban

      - name: Tag the Docker Image
        run: docker tag fastams:lban lbanapps.azurecr.io/fastams:lban

      - name: Push the Docker Image to Azure Container Registry
        run: docker push lbanapps.azurecr.io/fastams:lban

